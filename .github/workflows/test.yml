name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PI_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the tested Pi runtime
        run: npm install --global @earendil-works/pi-coding-agent@0.84.1

      - name: Run tests
        run: npm test
